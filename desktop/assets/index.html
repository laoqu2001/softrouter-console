<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6fa">
  <title>SUNIP · 软路由控制台</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="/" data-nav="devices">
        <span class="brand-mark" aria-hidden="true">S<span></span></span>
        <span class="brand-name">SUNIP<small>软路由控制台</small></span>
      </a>
      <div class="workspace-label">工作空间 <span>DESKTOP</span></div>
      <nav class="nav-list">
        <a href="/" data-nav="devices" class="nav-item active"><span data-icon="server"></span>设备管理<span class="nav-count" id="nav-count">—</span></a>
        <a href="/chat" data-nav="chat" class="nav-item"><span data-icon="message"></span>运维对话</a>
        <a href="/usage" data-nav="usage" class="nav-item"><span data-icon="chart"></span>用量统计</a>
      </nav>
      <div class="sidebar-note"><span class="note-icon" data-icon="activity"></span><strong>让每一台设备，都有迹可循。</strong><p>设备状态、部署交付与运维记录，在同一个工作台查看。</p></div>
      <div class="sidebar-bottom">
        <a id="mobile-link" class="nav-item subtle" target="_blank" rel="noopener noreferrer"><span data-icon="phone"></span>打开手机端<span class="end-icon" data-icon="external"></span></a>
        <button class="nav-item subtle" data-action="theme"><span data-icon="sun"></span><span id="theme-label">切换深色</span></button>
        <div class="account-row"><span class="account-avatar" data-icon="shield"></span><div><strong>管理员</strong><small><i id="connection-dot" class="connection-dot"></i><span id="connection-label">正在连接服务</span></small></div><button class="icon-button" data-action="logout" aria-label="退出当前浏览器登录" title="退出登录"><span data-icon="logout"></span></button></div>
      </div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <div class="breadcrumb"><span>工作台</span><span data-icon="chevron-right"></span><strong id="breadcrumb-title">设备管理</strong></div>
        <div class="topbar-right"><span class="desktop-badge">电脑端</span><span id="today" class="today"></span><span class="topbar-divider"></span><span class="mini-avatar" data-icon="user"></span></div>
      </header>
      <main id="main" tabindex="-1">
        <div id="global-error" class="global-error" role="alert" hidden></div>
        <div id="view"></div>
      </main>
    </div>
  </div>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="设备详情" hidden></aside>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
