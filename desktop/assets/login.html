<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · SUNIP 控制台</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-intro" aria-label="SUNIP 软路由控制台">
      <a class="brand login-brand" href="/"><span class="brand-mark" aria-hidden="true">S<span></span></span><span class="brand-name">SUNIP<small>软路由控制台</small></span></a>
      <div class="login-intro-copy"><span class="eyebrow">YOUR NETWORK, IN VIEW</span><h1>设备有序，<br>运维从容。</h1><p>从设备状态到远程运维，<br>在更宽阔的工作台里，一览全局。</p></div>
      <div class="network-visual" aria-hidden="true"><div class="network-line one"></div><div class="network-line two"></div><div class="network-line three"></div><div class="network-core"><svg viewBox="0 0 32 32" fill="none"><rect x="6" y="4" width="20" height="10" rx="3"/><rect x="6" y="18" width="20" height="10" rx="3"/><path d="M10 9h.01M10 23h.01M16 9h6M16 23h6"/></svg></div><div class="network-node node-one"><span></span></div><div class="network-node node-two"><span></span></div><div class="network-node node-three"><span></span></div></div>
      <div class="login-intro-footer">集中管理 · 安全交付 · 运维协作</div>
    </section>
    <section class="login-form-side">
      <div class="login-form-wrap"><span class="section-kicker">SUNIP DESKTOP</span><h2>登录工作台</h2><p class="login-subtitle">使用现有面板账号继续</p>
        <form id="login-form" action="/desktop/login" method="post">
          <label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="128" placeholder="请输入用户名" autofocus>
          <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" placeholder="请输入密码">
          <div id="login-error" class="form-error" role="alert" aria-live="polite"></div>
          <button id="login-submit" class="button primary login-submit" type="submit">登录控制台 <span aria-hidden="true">→</span></button>
        </form>
        <p class="login-footnote"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="4" y="8" width="12" height="9" rx="2"/><path d="M6 8V6a4 4 0 0 1 8 0v2"/></svg>与手机端使用同一套账号和设备数据</p>
      </div>
    </section>
  </main>
</body>
</html>
